<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alcove GST</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div id="auth" class="auth-page" hidden></div>
  <div id="shell" hidden>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu"><svg><use href="#i-menu"/></svg></button>
    <a class="brand" href="#/home"><svg class="brand-mark"><use href="#i-globe"/></svg><span>Alcove <b>GST</b></span></a>
    <form class="global-search" id="global-search" role="search">
      <svg><use href="#i-search"/></svg>
      <input id="global-q" type="search" placeholder="Search in Invoices ( / )" aria-label="Search invoices">
    </form>
    <div class="top-right">
      <label class="org-switch" title="Organisation (GSTIN)"><select id="org" aria-label="Organisation"></select></label>
      <a class="quick-add" href="#/imports" title="Import data" aria-label="Import data"><svg><use href="#i-plus"/></svg></a>
      <a class="top-icon" href="#/entities" title="Entities &amp; GSTINs" aria-label="Settings"><svg><use href="#i-gear"/></svg></a>
      <div id="user-slot"></div>
    </div>
  </header>

  <div class="frame">
    <nav class="rail" id="rail" aria-label="Main">
      <a href="#/home" data-route="home"><span class="rail-icon"><svg><use href="#i-home"/></svg></span>Home</a>
      <a href="#/dashboard" data-route="dashboard"><span class="rail-icon"><svg><use href="#i-gauge"/></svg></span>Dashboard</a>
      <a href="#/imports" data-route="imports"><span class="rail-icon"><svg><use href="#i-upload"/></svg></span>Imports</a>
      <a href="#/invoices" data-route="invoices"><span class="rail-icon"><svg><use href="#i-doc"/></svg></span>Transactions</a>
      <a href="#/advances" data-route="advances"><span class="rail-icon"><svg><use href="#i-wallet"/></svg></span>Advances</a>
      <a href="#/reports" data-route="reports"><span class="rail-icon"><svg><use href="#i-chart"/></svg></span>Reports</a>
      <a href="#/entities" data-route="entities"><span class="rail-icon"><svg><use href="#i-building"/></svg></span>Entities</a>
    </nav>
    <main id="main" class="panel" aria-live="polite"></main>
  </div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">

  </svg>
  <script src="/static/app.js"></script>

</html>
